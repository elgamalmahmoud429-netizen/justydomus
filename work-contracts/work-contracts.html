<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عقود العمل - Justy Domus</title>
<link rel="stylesheet" href="../style.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Cairo', sans-serif;
background-color: #f9f9f9;
color: #333;
margin: 0;
padding: 0;
}
.container-gallery {
max-width: 1100px;
margin: 40px auto;
padding: 0 20px;
text-align: center;
}
.gallery-title {
font-size: 2rem;
color: #2c3e50;
margin-bottom: 10px;
font-weight: 700;
}
.gallery-subtitle {
color: #666;
margin-bottom: 40px;
font-size: 1.1rem;
}
.images-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
gap: 30px;
justify-content: center;
}
.img-card {
background: #ffffff;
padding: 15px;
border-radius: 12px;
box-shadow: 0 10px 25px rgba(0,0,0,0.08);
transition: transform 0.3s ease, box-shadow 0.3s ease;
border: 1px solid #eaeaea;
}
.img-card:hover {
transform: translateY(-5px);
box-shadow: 0 15px 35px rgba(0,0,0,0.12);
}
.img-card img {
width: 100%;
height: auto;
border-radius: 8px;
display: block;
}
.back-btn-container {
margin: 50px 0;
}
.btn-custom {
display: inline-block;
background: #2c3e50;
color: #fff;
padding: 12px 30px;
border-radius: 6px;
text-decoration: none;
font-weight: 600;
transition: background 0.3s;
}
.btn-custom:hover {
background: #d4af37;
color: #fff;
}
</style>
</head>
<body>

<!-- شريط التنقل العلوي بدون أي أثر لـ Studio Europa -->
<header class="top-bar" style="background: #fff; padding: 15px 0; border-bottom: 1px solid #eee;">
<div class="container lang-container" style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px;">
<a href="../index.html" class="brand-subtitle" style="text-decoration: none; font-weight: bold; color: #2c3e50; font-size: 1.3rem;">JUSTY DOMUS</a>
<div class="top-right-controls" style="display: flex; gap: 15px; align-items: center;">
<a href="../index.html" style="text-decoration: none; color: #555;">الرئيسية</a>
<a href="../italy.html" style="text-decoration: none; color: #555;">خدمات إيطاليا</a>
<a href="../results.html" style="text-decoration: none; color: #d4af37; font-weight: bold;">أعمالنا ونتائجنا</a>
</div>
</div>
</header>

<!-- محتوى الصفحة وعرض الصور -->
<main class="container-gallery">
<h1 class="gallery-title">عقود العمل المنجزة</h1>
<p class="gallery-subtitle">استعراض نماذج وملفات عقود العمل والتوظيف الرسمية المدعومة من فريقنا.</p>

<div class="images-grid">
<!-- الصورة الأولى -->
<div class="img-card">
<img src="contract1.jpg" alt="عقد عمل 1">
</div>
<!-- الصورة الثانية -->
<div class="img-card">
<img src="contract2.jpg" alt="عقد عمل 2">
</div>
</div>

<div class="back-btn-container">
<a href="../italy.html" class="btn-custom">العودة لخدمات إيطاليا</a>
</div>
</main>

</body>
</html>
